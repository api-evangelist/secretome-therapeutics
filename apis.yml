aid: secretome-therapeutics
name: Secretome Therapeutics
description: >-
  Secretome Therapeutics is a clinical-stage biotechnology company (formerly NeoProgen, founded 2018)
  developing allogeneic, off-the-shelf regenerative therapies derived from neonatal cardiac progenitor
  cells (nCPCs). Its lead candidate STM-01, and the cell-free secretome STM-2, target heart failure with
  preserved ejection fraction (HFpEF), dilated cardiomyopathy (DCM) and Duchenne muscular dystrophy
  associated cardiomyopathy, and are in Phase 1 clinical study. The company publishes a corporate and
  investor-relations website covering its science, pipeline, team, patient/expanded-access policy and
  press releases; it publishes no developer program, API, SDK or machine-readable contract of any kind.
